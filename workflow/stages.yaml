workflow_version: "0.1"

principles:
  fixed_topology: true
  sequential_implementation: true
  stage_skipping_requires_reason: true
  external_tools_must_fit_declared_stage: true
  llm_output_byte_determinism_required: false
  structural_determinism_required: true

stages:
  - id: "00"
    name: initialize
    purpose: Pin workflow, policies, OKF specifications, adapter contracts, and toolchain assumptions.
    status: complete
    deterministic: true
    inputs: []
    outputs:
      - workflow/stages.yaml
      - specs/okf/versions.yaml
      - docs/adapter-contract.md
    completion_criteria:
      - stage graph is explicit and ordered
      - supported OKF versions are pinned to immutable upstream commits
      - adjacent-version adapter contract is documented
      - future stages cannot silently add undeclared processing steps

  - id: "01"
    name: acquire
    purpose: Acquire or copy supplied source artifacts without semantic transformation.
    status: complete
    deterministic: true
    inputs:
      - explicit source locator
      - source identifier
      - optional provider and provider-specific acquisition parameters
    outputs:
      - .okf-generator/acquired/<source-id>/payload/
      - .okf-generator/acquired/<source-id>/receipt.json
      - workflow/acquisition.yaml
      - workflow/tools/stage-01.yaml
      - docs/stage-01-acquire.md
    completion_criteria:
      - local file and directory bytes are preserved
      - symlinks are preserved instead of silently followed
      - one explicit HTTP(S) resource can be acquired with bounded size
      - git repositories are acquired as bare repositories without checkout transformations
      - existing acquisitions are not overwritten implicitly
      - provider failure does not publish partial output
      - Stage 01 receipts contain no Stage 02 fingerprint
      - new source systems can be added through the provider contract without changing pipeline topology

  - id: "02"
    name: snapshot
    purpose: Fingerprint and preserve immutable source versions.
    status: complete
    deterministic: true
    inputs:
      - completed Stage 01 acquisition directory and receipt
    outputs:
      - .okf-generator/snapshots/<source-id>/sha256-<identity>/payload/
      - .okf-generator/snapshots/<source-id>/sha256-<identity>/snapshot.json
      - .okf-generator/snapshots/<source-id>/sha256-<identity>/integrity.json
      - .okf-generator/snapshots/<source-id>/sha256-<identity>/acquisition-receipt.json
      - workflow/snapshot.yaml
      - workflow/tools/stage-02.yaml
      - docs/stage-02-snapshot.md
    completion_criteria:
      - ordinary artifacts use stable canonical SHA-256 content identities
      - Git sources lock the selected object and peeled commit identity
      - copied payload integrity is checked before atomic publication
      - existing snapshots are never overwritten
      - identical repeat snapshots verify and return idempotently
      - mutation of an existing snapshot is detected
      - acquisition receipts are preserved and integrity-checked
      - Stage 02 introduces no media classification or content extraction

  - id: "03"
    name: classify
    purpose: Classify source and media types for routing.
    status: complete
    deterministic: true
    inputs:
      - verified Stage 02 source_id and immutable snapshot_id
    outputs:
      - .okf-generator/classifications/<source-id>/<snapshot-id>/<ruleset>/classification.json
      - workflow/classification.yaml
      - workflow/tools/stage-03.yaml
      - docs/stage-03-classify.md
    completion_criteria:
      - only verified immutable Stage 02 snapshots are classified
      - classification is byte-deterministic for a fixed snapshot and ruleset
      - rule changes require a new ruleset instead of overwriting prior output
      - signature and container evidence outrank conflicting filename extensions
      - textual routes require a compatible bounded text probe
      - directory inventories are deterministic and symlinks are not followed
      - Git snapshots are routed at repository level without source-tree extraction
      - snapshot mutation during classification is detected
      - classification introduces no semantic parsing or extraction

  - id: "04"
    name: extract
    purpose: Convert source artifacts into structured source representations.
    status: complete
    deterministic: mixed
    inputs:
      - verified Stage 02 source_id and immutable snapshot_id
      - existing Stage 03 classification for the configured ruleset
    outputs:
      - .okf-generator/extractions/<source-id>/<snapshot-id>/<classification-ruleset>/<profile>/extraction.json
      - .okf-generator/extractions/<source-id>/<snapshot-id>/<classification-ruleset>/<profile>/units.jsonl
      - workflow/extraction.yaml
      - workflow/tools/stage-04.yaml
      - docs/stage-04-extract.md
    completion_criteria:
      - only verified Stage 02 and Stage 03 pairs are extracted
      - output is bound to exact snapshot and classification hashes
      - source-native text and locators are retained without Stage 05 normalization
      - PDF embedded text is page-addressable and no-text pages are diagnosed
      - OOXML, ODF, and EPUB package ordering and native locators are represented
      - archive and Git extraction are bounded and preserve member/blob identity
      - every classified entry is represented or explicitly diagnosed as unsupported
      - symlinks are never dereferenced
      - input mutation during extraction is detected
      - existing extraction output is never overwritten
      - Stage 04 introduces no normalization, synthesis, or OKF serialization

  - id: "05"
    name: normalize
    purpose: Canonicalize extracted text, metadata, anchors, and source identifiers.
    status: complete
    deterministic: true
    inputs:
      - verified Stage 04 extraction for the configured source/snapshot/ruleset/profile
    outputs:
      - .okf-generator/normalized/<source-id>/<snapshot-id>/<classification-ruleset>/<extraction-profile>/<normalization-profile>/normalization.json
      - .okf-generator/normalized/<source-id>/<snapshot-id>/<classification-ruleset>/<extraction-profile>/<normalization-profile>/units.jsonl
      - workflow/normalization.yaml
      - workflow/tools/stage-05.yaml
      - docs/stage-05-normalize.md
    completion_criteria:
      - only verified Stage 04 extraction outputs are normalized
      - extraction manifest hash, units hash, unit count, diagnostic count, and unit schema are validated
      - text normalization is limited to Unicode NFC and LF line-ending canonicalization
      - spaces, tabs, blank lines, leading/trailing whitespace, and terminal newlines are preserved
      - JSON data, native locators, metadata, and diagnostics are NFC-canonicalized without list reordering
      - non-finite numbers, Unicode surrogate values, NFC key collisions, and normalized path collisions are rejected
      - logical source URI and immutable source-version URI are deterministic
      - native-locator anchors are independent of Stage 04 sequence IDs and collisions are rejected
      - normalized unit content receives a deterministic SHA-256 fingerprint
      - existing normalized output is never overwritten and repeat runs are byte-idempotent
      - mutation of Stage 04 evidence during normalization is detected
      - Stage 05 introduces no semantic chunking, synthesis, or OKF serialization

  - id: "06"
    name: synthesize
    purpose: Produce candidate concepts, claims, relations, and summaries.
    status: complete
    deterministic: false
    inputs:
      - verified Stage 05 normalization for the configured source/snapshot/ruleset/profiles
      - explicit model identifier
    outputs:
      - .okf-generator/syntheses/<source-id>/<snapshot-id>/<classification-ruleset>/<extraction-profile>/<normalization-profile>/<synthesis-profile>/<provider>/sha256-<run>/synthesis.json
      - .okf-generator/syntheses/<source-id>/<snapshot-id>/<classification-ruleset>/<extraction-profile>/<normalization-profile>/<synthesis-profile>/<provider>/sha256-<run>/requests.jsonl
      - .okf-generator/syntheses/<source-id>/<snapshot-id>/<classification-ruleset>/<extraction-profile>/<normalization-profile>/<synthesis-profile>/<provider>/sha256-<run>/responses.jsonl
      - .okf-generator/syntheses/<source-id>/<snapshot-id>/<classification-ruleset>/<extraction-profile>/<normalization-profile>/<synthesis-profile>/<provider>/sha256-<run>/receipts.jsonl
      - .okf-generator/syntheses/<source-id>/<snapshot-id>/<classification-ruleset>/<extraction-profile>/<normalization-profile>/<synthesis-profile>/<provider>/sha256-<run>/candidates.jsonl
      - workflow/synthesis.yaml
      - workflow/tools/stage-06.yaml
      - docs/stage-06-synthesize.md
    completion_criteria:
      - only verified Stage 05 normalized evidence is accepted
      - prompt and candidate-schema versions and hashes are persisted
      - complete normalized units are deterministically batched without silent truncation
      - exact model requests, parsed structured responses, provider receipts, and candidates are immutable run artifacts
      - every candidate cites only evidence anchors supplied in its own batch
      - duplicate or unknown evidence anchors and invalid relation indices fail closed
      - relation endpoints are translated from batch-local indices to workflow-owned local candidate IDs
      - provider refusal, incomplete response, malformed output, and oversized single units fail without publication
      - distinct model runs coexist as immutable content-addressed run directories
      - mutation of Stage 05 evidence during synthesis is detected
      - Stage 06 introduces no Stage 07 identity resolution or Stage 08 planning

  - id: "07"
    name: resolve
    purpose: Match candidates against existing concept identities.
    status: planned
    deterministic: mixed

  - id: "08"
    name: plan
    purpose: Decide create, update, merge, contradict, supersede, or ignore operations.
    status: planned
    deterministic: mixed

  - id: "09"
    name: compile
    purpose: Apply accepted changes to the canonical internal knowledge state.
    status: planned
    deterministic: true

  - id: "10"
    name: structuralize
    purpose: Apply base LLM-Wiki and initial OKF structural conventions.
    status: planned
    deterministic: true

  - id: "11"
    name: migrate
    purpose: Apply adjacent OKF version adapters sequentially to the configured target version.
    status: planned
    deterministic: true

  - id: "12"
    name: enrich
    purpose: Populate optional target-version semantics only when supported by actual evidence or policy.
    status: planned
    deterministic: mixed

  - id: "13"
    name: derive
    purpose: Derive indexes, logs, backlinks, graphs, and manifests from canonical state.
    status: planned
    deterministic: true

  - id: "14"
    name: serialize
    purpose: Emit canonical Markdown/YAML and other declared bundle artifacts.
    status: planned
    deterministic: true

  - id: "15"
    name: conformance
    purpose: Run version-appropriate independent OKF validators.
    status: planned
    deterministic: true

  - id: "16"
    name: quality
    purpose: Apply stricter project quality rules beyond base OKF conformance.
    status: planned
    deterministic: mixed

  - id: "17"
    name: regression
    purpose: Check invariants, idempotence, change locality, and version migration behavior.
    status: planned
    deterministic: true

  - id: "18"
    name: package
    purpose: Optionally sign, publish, serve, or otherwise package the validated bundle.
    status: planned
    deterministic: mixed

stage_change_policy:
  rule: A new processing operation must map to an existing stage or require a workflow version change.
  no_op_allowed: true
  skip_requires_recorded_reason: true

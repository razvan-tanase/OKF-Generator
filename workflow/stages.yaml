workflow_version: "0.1"

principles:
  fixed_topology: true
  sequential_implementation: true
  stage_skipping_requires_reason: true
  external_tools_must_fit_declared_stage: true
  llm_output_byte_determinism_required: false
  structural_determinism_required: true

stages:
  - id: "00"
    name: initialize
    purpose: Pin workflow, policies, OKF specifications, adapter contracts, and toolchain assumptions.
    status: complete
    deterministic: true
    inputs: []
    outputs:
      - workflow/stages.yaml
      - specs/okf/versions.yaml
      - docs/adapter-contract.md
    completion_criteria:
      - stage graph is explicit and ordered
      - supported OKF versions are pinned to immutable upstream commits
      - adjacent-version adapter contract is documented
      - future stages cannot silently add undeclared processing steps

  - id: "01"
    name: acquire
    purpose: Acquire or copy supplied source artifacts without semantic transformation.
    status: complete
    deterministic: true
    inputs:
      - explicit source locator
      - source identifier
      - optional provider and provider-specific acquisition parameters
    outputs:
      - .okf-generator/acquired/<source-id>/payload/
      - .okf-generator/acquired/<source-id>/receipt.json
      - workflow/acquisition.yaml
      - workflow/tools/stage-01.yaml
      - docs/stage-01-acquire.md
    completion_criteria:
      - local file and directory bytes are preserved
      - symlinks are preserved instead of silently followed
      - one explicit HTTP(S) resource can be acquired with bounded size
      - git repositories are acquired as bare repositories without checkout transformations
      - existing acquisitions are not overwritten implicitly
      - provider failure does not publish partial output
      - Stage 01 receipts contain no Stage 02 fingerprint
      - new source systems can be added through the provider contract without changing pipeline topology

  - id: "02"
    name: snapshot
    purpose: Fingerprint and preserve immutable source versions.
    status: complete
    deterministic: true
    inputs:
      - completed Stage 01 acquisition directory and receipt
    outputs:
      - .okf-generator/snapshots/<source-id>/sha256-<identity>/payload/
      - .okf-generator/snapshots/<source-id>/sha256-<identity>/snapshot.json
      - .okf-generator/snapshots/<source-id>/sha256-<identity>/integrity.json
      - .okf-generator/snapshots/<source-id>/sha256-<identity>/acquisition-receipt.json
      - workflow/snapshot.yaml
      - workflow/tools/stage-02.yaml
      - docs/stage-02-snapshot.md
    completion_criteria:
      - ordinary artifacts use stable canonical SHA-256 content identities
      - Git sources lock the selected object and peeled commit identity
      - copied payload integrity is checked before atomic publication
      - existing snapshots are never overwritten
      - identical repeat snapshots verify and return idempotently
      - mutation of an existing snapshot is detected
      - acquisition receipts are preserved and integrity-checked
      - Stage 02 introduces no media classification or content extraction

  - id: "03"
    name: classify
    purpose: Classify source and media types for routing.
    status: complete
    deterministic: true
    inputs:
      - verified Stage 02 source_id and immutable snapshot_id
    outputs:
      - .okf-generator/classifications/<source-id>/<snapshot-id>/<ruleset>/classification.json
      - workflow/classification.yaml
      - workflow/tools/stage-03.yaml
      - docs/stage-03-classify.md
    completion_criteria:
      - only verified immutable Stage 02 snapshots are classified
      - classification is byte-deterministic for a fixed snapshot and ruleset
      - rule changes require a new ruleset instead of overwriting prior output
      - signature and container evidence outrank conflicting filename extensions
      - textual routes require a compatible bounded text probe
      - directory inventories are deterministic and symlinks are not followed
      - Git snapshots are routed at repository level without source-tree extraction
      - snapshot mutation during classification is detected
      - classification introduces no semantic parsing or extraction

  - id: "04"
    name: extract
    purpose: Convert source artifacts into structured source representations.
    status: complete
    deterministic: mixed
    inputs:
      - verified Stage 02 source_id and immutable snapshot_id
      - existing Stage 03 classification for the configured ruleset
    outputs:
      - .okf-generator/extractions/<source-id>/<snapshot-id>/<classification-ruleset>/<profile>/extraction.json
      - .okf-generator/extractions/<source-id>/<snapshot-id>/<classification-ruleset>/<profile>/units.jsonl
      - workflow/extraction.yaml
      - workflow/tools/stage-04.yaml
      - docs/stage-04-extract.md
    completion_criteria:
      - only verified Stage 02 and Stage 03 pairs are extracted
      - output is bound to exact snapshot and classification hashes
      - source-native text and locators are retained without Stage 05 normalization
      - PDF embedded text is page-addressable and no-text pages are diagnosed
      - OOXML, ODF, and EPUB package ordering and native locators are represented
      - archive and Git extraction are bounded and preserve member/blob identity
      - every classified entry is represented or explicitly diagnosed as unsupported
      - symlinks are never dereferenced
      - input mutation during extraction is detected
      - existing extraction output is never overwritten
      - Stage 04 introduces no normalization, synthesis, or OKF serialization

  - id: "05"
    name: normalize
    purpose: Canonicalize extracted text, metadata, anchors, and source identifiers.
    status: complete
    deterministic: true
    inputs:
      - verified Stage 04 extraction for the configured source/snapshot/ruleset/profile
    outputs:
      - .okf-generator/normalized/<source-id>/<snapshot-id>/<classification-ruleset>/<extraction-profile>/<normalization-profile>/normalization.json
      - .okf-generator/normalized/<source-id>/<snapshot-id>/<classification-ruleset>/<extraction-profile>/<normalization-profile>/units.jsonl
      - workflow/normalization.yaml
      - workflow/tools/stage-05.yaml
      - docs/stage-05-normalize.md
    completion_criteria:
      - only verified Stage 04 extraction outputs are normalized
      - extraction manifest hash, units hash, unit count, diagnostic count, and unit schema are validated
      - text normalization is limited to Unicode NFC and LF line-ending canonicalization
      - spaces, tabs, blank lines, leading/trailing whitespace, and terminal newlines are preserved
      - JSON data, native locators, metadata, and diagnostics are NFC-canonicalized without list reordering
      - non-finite numbers, Unicode surrogate values, NFC key collisions, and normalized path collisions are rejected
      - logical source URI and immutable source-version URI are deterministic
      - native-locator anchors are independent of Stage 04 sequence IDs and collisions are rejected
      - normalized unit content receives a deterministic SHA-256 fingerprint
      - existing normalized output is never overwritten and repeat runs are byte-idempotent
      - mutation of Stage 04 evidence during normalization is detected
      - Stage 05 introduces no semantic chunking, synthesis, or OKF serialization

  - id: "06"
    name: synthesize
    purpose: Produce candidate concepts, claims, relations, and summaries.
    status: complete
    deterministic: false
    inputs:
      - verified Stage 05 normalization for the configured source/snapshot/ruleset/profiles
      - explicit model identifier
    outputs:
      - .okf-generator/syntheses/<source-id>/<snapshot-id>/<classification-ruleset>/<extraction-profile>/<normalization-profile>/<synthesis-profile>/<provider>/sha256-<run>/synthesis.json
      - .okf-generator/syntheses/<source-id>/<snapshot-id>/<classification-ruleset>/<extraction-profile>/<normalization-profile>/<synthesis-profile>/<provider>/sha256-<run>/requests.jsonl
      - .okf-generator/syntheses/<source-id>/<snapshot-id>/<classification-ruleset>/<extraction-profile>/<normalization-profile>/<synthesis-profile>/<provider>/sha256-<run>/responses.jsonl
      - .okf-generator/syntheses/<source-id>/<snapshot-id>/<classification-ruleset>/<extraction-profile>/<normalization-profile>/<synthesis-profile>/<provider>/sha256-<run>/receipts.jsonl
      - .okf-generator/syntheses/<source-id>/<snapshot-id>/<classification-ruleset>/<extraction-profile>/<normalization-profile>/<synthesis-profile>/<provider>/sha256-<run>/candidates.jsonl
      - workflow/synthesis.yaml
      - workflow/tools/stage-06.yaml
      - docs/stage-06-synthesize.md
    completion_criteria:
      - only verified Stage 05 normalized evidence is accepted
      - prompt and candidate-schema versions and hashes are persisted
      - complete normalized units are deterministically batched without silent truncation
      - exact model requests, parsed structured responses, provider receipts, and candidates are immutable run artifacts
      - every candidate cites only evidence anchors supplied in its own batch
      - duplicate or unknown evidence anchors and invalid relation indices fail closed
      - relation endpoints are translated from batch-local indices to workflow-owned local candidate IDs
      - provider refusal, incomplete response, malformed output, and oversized single units fail without publication
      - distinct model runs coexist as immutable content-addressed run directories
      - mutation of Stage 05 evidence during synthesis is detected
      - Stage 06 introduces no Stage 07 identity resolution or Stage 08 planning

  - id: "07"
    name: resolve
    purpose: Match candidates against existing concept identities.
    status: complete
    deterministic: mixed
    inputs:
      - exact verified Stage 06 synthesis run selected by source/snapshot/provider/run_id
      - optional read-only resolution catalog; omitted catalog means explicit empty first-run catalog
      - optional explicit adjudication model
    outputs:
      - .okf-generator/resolutions/<source-id>/<snapshot-id>/<classification-ruleset>/<extraction-profile>/<normalization-profile>/<synthesis-profile>/<synthesis-provider>/<synthesis-run-id>/<resolution-profile>/sha256-<run>/resolution.json
      - .okf-generator/resolutions/<source-id>/<snapshot-id>/<classification-ruleset>/<extraction-profile>/<normalization-profile>/<synthesis-profile>/<synthesis-provider>/<synthesis-run-id>/<resolution-profile>/sha256-<run>/catalog.json
      - .okf-generator/resolutions/<source-id>/<snapshot-id>/<classification-ruleset>/<extraction-profile>/<normalization-profile>/<synthesis-profile>/<synthesis-provider>/<synthesis-run-id>/<resolution-profile>/sha256-<run>/resolutions.jsonl
      - .okf-generator/resolutions/<source-id>/<snapshot-id>/<classification-ruleset>/<extraction-profile>/<normalization-profile>/<synthesis-profile>/<synthesis-provider>/<synthesis-run-id>/<resolution-profile>/sha256-<run>/adjudication-requests.jsonl
      - .okf-generator/resolutions/<source-id>/<snapshot-id>/<classification-ruleset>/<extraction-profile>/<normalization-profile>/<synthesis-profile>/<synthesis-provider>/<synthesis-run-id>/<resolution-profile>/sha256-<run>/adjudication-responses.jsonl
      - .okf-generator/resolutions/<source-id>/<snapshot-id>/<classification-ruleset>/<extraction-profile>/<normalization-profile>/<synthesis-profile>/<synthesis-provider>/<synthesis-run-id>/<resolution-profile>/sha256-<run>/adjudication-receipts.jsonl
      - workflow/resolution.yaml
      - workflow/tools/stage-07.yaml
      - docs/stage-07-resolve.md
    completion_criteria:
      - Stage 06 artifact hashes and content-addressed run identity are reverified before resolution
      - only concept candidates are identity-resolved; summaries, claims, and relations remain Stage 06 candidates
      - missing catalog is an explicit empty first-run catalog and does not allocate identities
      - catalog internal IDs and normalized canonical paths are unique and catalog mutation is detected
      - source-anchor/resource overlap is only identity evidence when corroborated by compatible name identity
      - exact alias/history and title/path matches can resolve deterministically
      - lexical similarity produces a shortlist but never auto-merges an identity
      - optional adjudication can only choose from the deterministic shortlist, declare new, or preserve ambiguity
      - deterministic and adjudicated outputs are preserved as immutable content-addressed runs
      - Stage 07 never mutates the identity catalog or canonical state and introduces no Stage 08 planning

  - id: "08"
    name: plan
    purpose: Decide create, update, merge, contradict, supersede, or ignore operations.
    status: complete
    deterministic: mixed
    inputs:
      - exact verified Stage 07 resolution run and its bound Stage 06 synthesis candidates
      - optional read-only planning-state v0.1 claims/relations projection
      - optional explicit decision ledger v0.1
    outputs:
      - .okf-generator/plans/<source-id>/<snapshot-id>/<classification-ruleset>/<extraction-profile>/<normalization-profile>/<synthesis-profile>/<synthesis-provider>/<synthesis-run-id>/<resolution-profile>/<resolution-run-id>/<planning-profile>/sha256-<run>/plan.json
      - .okf-generator/plans/<source-id>/<snapshot-id>/<classification-ruleset>/<extraction-profile>/<normalization-profile>/<synthesis-profile>/<synthesis-provider>/<synthesis-run-id>/<resolution-profile>/<resolution-run-id>/<planning-profile>/sha256-<run>/planning-state.json
      - .okf-generator/plans/<source-id>/<snapshot-id>/<classification-ruleset>/<extraction-profile>/<normalization-profile>/<synthesis-profile>/<synthesis-provider>/<synthesis-run-id>/<resolution-profile>/<resolution-run-id>/<planning-profile>/sha256-<run>/decisions.json
      - .okf-generator/plans/<source-id>/<snapshot-id>/<classification-ruleset>/<extraction-profile>/<normalization-profile>/<synthesis-profile>/<synthesis-provider>/<synthesis-run-id>/<resolution-profile>/<resolution-run-id>/<planning-profile>/sha256-<run>/operations.jsonl
      - workflow/planning.yaml
      - workflow/tools/stage-08.yaml
      - docs/stage-08-plan.md
    completion_criteria:
      - Stage 07 artifact hashes and content-addressed run identity are reverified before planning
      - the bound Stage 06 candidate graph and content-addressed synthesis run are reverified
      - matched, new, and ambiguous concepts map conservatively to update, create, or ignore unless an explicit merge decision exists
      - new objects receive deterministic provisional identities and collision-safe proposed concept paths
      - exact existing and same-run duplicate claims, relations, concepts, and summaries are handled deterministically
      - contradiction, supersession, and multi-identity merge require explicit auditable decisions
      - relation endpoints are translated through the concept plan and unresolved endpoints become explicit ignore operations
      - planning-state and decision-ledger mutation during planning is detected
      - existing plan output is immutable and content-addressed
      - Stage 08 mutates no canonical knowledge state and introduces no Stage 09 compilation

  - id: "09"
    name: compile
    purpose: Apply accepted changes to the canonical internal knowledge state.
    status: complete
    deterministic: true
    inputs:
      - exact verified Stage 08 plan run and its bound Stage 07/06 evidence chain
      - active canonical state generation when current.json exists
    outputs:
      - .okf-generator/state/current.json
      - .okf-generator/state/generations/sha256-<generation>/state.json
      - .okf-generator/state/generations/sha256-<generation>/concepts.jsonl
      - .okf-generator/state/generations/sha256-<generation>/summaries.jsonl
      - .okf-generator/state/generations/sha256-<generation>/claims.jsonl
      - .okf-generator/state/generations/sha256-<generation>/relations.jsonl
      - .okf-generator/state/generations/sha256-<generation>/identity-registry.json
      - .okf-generator/state/generations/sha256-<generation>/events.jsonl
      - .okf-generator/state/generations/sha256-<generation>/resolution-catalog.json
      - .okf-generator/state/generations/sha256-<generation>/planning-state.json
      - workflow/compilation.yaml
      - workflow/tools/stage-09.yaml
      - docs/stage-09-compile.md
    completion_criteria:
      - Stage 08 artifact hashes and content-addressed plan identity are reverified before compilation
      - the bound Stage 07 resolution and Stage 06 synthesis are reverified
      - a plan whose catalog/planning-state base differs from current canonical projections is rejected as stale
      - Stage 08 provisional identities are deterministically finalized without reallocating existing identities
      - create, update, merge, contradict, supersede, and ignore operations are applied under object-type-specific constraints
      - concept merges preserve title/path/alias/source history and rewrite active relation endpoints
      - claim contradiction and supersession relationships are stored reciprocally and merge references are rewritten
      - every planned operation appends an auditable event, including ignore operations
      - generated Stage 07/08 projections are deterministic functions of canonical state
      - immutable generations are content-addressed and current.json switches atomically only after full validation
      - active-plan replay is idempotent only when provenance hashes match and ancestor-plan replay is rejected
      - Stage 09 introduces no Stage 10 structuralization or OKF serialization

  - id: "10"
    name: structuralize
    purpose: Apply base LLM-Wiki and initial OKF structural conventions.
    status: complete
    deterministic: true
    inputs:
      - exact verified Stage 09 canonical generation, selected explicitly or from the atomic current pointer
      - repository-pinned OKF v0.1 structural specification commit
    outputs:
      - .okf-generator/structural/<stage09-generation-id>/<profile>/sha256-<run>/structuralization.json
      - .okf-generator/structural/<stage09-generation-id>/<profile>/sha256-<run>/documents.jsonl
      - .okf-generator/structural/<stage09-generation-id>/<profile>/sha256-<run>/identity-map.json
      - .okf-generator/structural/<stage09-generation-id>/<profile>/sha256-<run>/deferred.json
      - workflow/structuralization.yaml
      - workflow/tools/stage-10.yaml
      - docs/stage-10-structuralize.md
    completion_criteria:
      - Stage 09 generation identity, hashes, counts, projections, registry, and cross-references are reverified
      - every active canonical object projects to one typed structural OKF document
      - canonical concept paths are preserved and non-concept paths are stable and collision-checked
      - raw private internal identities remain outside public document frontmatter and paths
      - merged/tombstoned objects remain represented in the private identity sidecar without public documents
      - claim and relation links resolve through active public document paths
      - index.md and log.md ownership remains deferred to Stage 13
      - final Markdown/YAML serialization remains deferred to Stage 14
      - OKFy and OpenWiki compatibility is evaluated against pinned versions without becoming runtime dependencies
      - canonical state mutation during structuralization is detected before publication
      - existing structural output is immutable and content-addressed

  - id: "11"
    name: migrate
    purpose: Apply adjacent OKF version adapters sequentially to the configured target version.
    status: planned
    deterministic: true

  - id: "12"
    name: enrich
    purpose: Populate optional target-version semantics only when supported by actual evidence or policy.
    status: planned
    deterministic: mixed

  - id: "13"
    name: derive
    purpose: Derive indexes, logs, backlinks, graphs, and manifests from canonical state.
    status: planned
    deterministic: true

  - id: "14"
    name: serialize
    purpose: Emit canonical Markdown/YAML and other declared bundle artifacts.
    status: planned
    deterministic: true

  - id: "15"
    name: conformance
    purpose: Run version-appropriate independent OKF validators.
    status: planned
    deterministic: true

  - id: "16"
    name: quality
    purpose: Apply stricter project quality rules beyond base OKF conformance.
    status: planned
    deterministic: mixed

  - id: "17"
    name: regression
    purpose: Check invariants, idempotence, change locality, and version migration behavior.
    status: planned
    deterministic: true

  - id: "18"
    name: package
    purpose: Optionally sign, publish, serve, or otherwise package the validated bundle.
    status: planned
    deterministic: mixed

stage_change_policy:
  rule: A new processing operation must map to an existing stage or require a workflow version change.
  no_op_allowed: true
  skip_requires_recorded_reason: true

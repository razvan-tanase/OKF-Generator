[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "okf-generator"
version = "0.1.0"
description = "Versioned pipeline for building Open Knowledge Format bundles"
requires-python = ">=3.11"
license = {text = "MIT"}

[project.scripts]
okf-generator = "okf_generator.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
